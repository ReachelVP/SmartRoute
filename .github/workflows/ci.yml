name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-build:
    name: Backend (Spring Boot)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # Un solo comando hace las tres cosas que pide la rubrica, en orden (Gradle resuelve las
      # dependencias entre tareas): compileJava, test (unitarias + integracion con Testcontainers
      # -- el runner ya trae Docker, no hace falta "services:" ni crear la base a mano) y
      # jacocoTestCoverageVerification (>=70% en el paquete de negocio) antes de empaquetar.
      - name: Compilar, probar y verificar cobertura (JaCoCo >= 70%)
        run: ./gradlew build

  spa-build:
    name: SPA (React + Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: spa
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: spa/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  # Laboratorio 7: despliegue automático, pero solo desde main y solo si las dos verificaciones de
  # arriba pasaron ("needs") -- a diferencia del auto-deploy nativo de Render (que dispara con
  # cualquier push, sin enterarse de si CI pasó), este job es el que de verdad gatea el deploy con
  # el resultado de las pruebas. Los Deploy Hooks de Render son URLs secretas (equivalen a una
  # credencial: cualquiera que las tenga puede disparar un deploy) -- viven únicamente en GitHub
  # Secrets, nunca en este archivo ni en AUDITORIA-SEGURIDAD.md.
  deploy:
    name: Desplegar a Render
    runs-on: ubuntu-latest
    needs: [backend-build, spa-build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Disparar deploy de la API
        run: curl -fsS -X POST "${{ secrets.RENDER_DEPLOY_HOOK_API }}"

      - name: Disparar deploy de la SPA
        run: curl -fsS -X POST "${{ secrets.RENDER_DEPLOY_HOOK_SPA }}"
