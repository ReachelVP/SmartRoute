spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Este archivo reemplaza por completo al application.properties de main en el classpath de
# pruebas (Spring Boot no los combina), así que las propiedades sin valor por defecto -- como el
# secreto de JWT -- tienen que repetirse aquí o JwtService falla con PlaceholderResolutionException
# al levantar el contexto.
smartroute.jwt.secret=smartroute-eif509-pruebas-de-integracion-llave-de-prueba-no-usar-en-produccion

# Util para documentar el SQL real que genera cada consulta de negocio (docs/consultas-negocio.md)
# y para ver el problema N+1 en la salida de las pruebas, no solo en el conteo de estadisticas.
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE
spring.jpa.properties.hibernate.format_sql=true
