<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <title th:text="${esNuevo} ? 'SmartRoute · Admin · Nueva categoría' : 'SmartRoute · Admin · Editar categoría'"></title>
  <div th:replace="~{admin/fragments/estilos :: estilos}"></div>
</head>
<body>
  <div th:replace="~{admin/fragments/nav :: nav}"></div>

  <main class="admin-contenido">
    <h1 th:text="${esNuevo} ? 'Nueva categoría' : 'Editar categoría'"></h1>

    <form th:object="${categoriaFormulario}"
          th:action="${esNuevo} ? @{/admin/categorias/nuevo} : @{/admin/categorias/{id}/editar(id=${id})}"
          method="post" class="formulario-admin">

      <div class="campo">
        <label for="nombre">Nombre</label>
        <input type="text" id="nombre" th:field="*{nombre}"/>
        <span class="error-campo" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}"></span>
      </div>

      <div class="campo">
        <label for="descripcion">Descripción</label>
        <textarea id="descripcion" th:field="*{descripcion}" rows="3"></textarea>
        <span class="error-campo" th:if="${#fields.hasErrors('descripcion')}" th:errors="*{descripcion}"></span>
      </div>

      <button type="submit" class="boton" th:text="${esNuevo} ? 'Crear' : 'Guardar cambios'"></button>
      <a th:href="@{/admin/categorias}" class="boton boton--secundario">Cancelar</a>
    </form>
  </main>
</body>
</html>
