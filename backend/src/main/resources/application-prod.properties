# Perfil de producción: todo sale de variables de entorno de la plataforma (Render/Railway),
# nunca de un valor fijo acá. Sin "valor por defecto" en el placeholder (${VAR}, no ${VAR:algo}):
# si falta alguna, el arranque falla rápido y explícito en vez de arrancar con un valor equivocado.
#
# Variables de entorno esperadas (nombres documentados también en el README del repositorio):
#   DB_URL, DB_USERNAME, DB_PASSWORD   -- SQL Server (Azure SQL Database)
#   MONGODB_URI                         -- MongoDB Atlas
#   JWT_SECRET                          -- distinto del de application-dev.properties
#   CORS_ALLOWED_ORIGIN                 -- URL pública real de la SPA desplegada

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.mongodb.uri=${MONGODB_URI}

smartroute.jwt.secret=${JWT_SECRET}
smartroute.jwt.expiracion-minutos=60

smartroute.cors.allowed-origin=${CORS_ALLOWED_ORIGIN}

# En producción no hace falta recrear estadísticas de SQL en cada arranque ni exponer stacktraces.
server.error.include-stacktrace=never
