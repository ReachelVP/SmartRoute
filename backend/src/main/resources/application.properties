spring.application.name=smartroute

# Local y en la nube por igual: sin perfil explicito, "dev" es el default (application-dev.properties).
# Render/Railway fijan SPRING_PROFILES_ACTIVE=prod como variable de entorno de la plataforma.
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Render/Railway inyectan PORT; en local, sin esa variable, cae en 8080 como siempre.
server.port=${PORT:8080}

# Laboratorio 7 (auditoria de seguridad, OWASP A02:2025 Security Misconfiguration): detras del
# proxy de Render, la conexion que le llega a Spring Boot es HTTP (el proxy termina el TLS); sin
# esto, Spring nunca se entera de que la peticion original fue HTTPS. Efecto concreto: la cabecera
# HSTS que agrega Spring Security no se enviaba nunca (solo la agrega si "request.isSecure()"), y
# el Location: que arma POST /api/v1/lugares (ServletUriComponentsBuilder.fromCurrentRequest())
# salia como http:// en vez de https://. "framework" hace que Spring Boot lea X-Forwarded-Proto/
# X-Forwarded-Host (que Render sí manda) y corrija ambas cosas. Sin efecto en dev (no hay proxy).
server.forward-headers-strategy=framework

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.data.mongodb.auto-index-creation=true

springdoc.swagger-ui.path=/swagger-ui.html

# Observabilidad minima (Laboratorio 7): solo /actuator/health, sin detalle de componentes (no
# hay que exponer si Mongo/SQL Server estan caidos a cualquiera que pegue el endpoint). Explicito
# a proposito -- son los mismos valores por defecto de Spring Boot, pero declararlos evita que un
# futuro cambio (p. ej. agregar otro starter) los exponga sin querer.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
